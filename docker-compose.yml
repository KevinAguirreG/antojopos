# Base infrastructure for local development (roadmap session 5).
# Application services get added here as they're built, starting in session 6.
# Every port binds to 127.0.0.1: nothing here is meant to be reachable from the LAN.
name: antojopos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      # Read by initdb/10-service-databases.sh, one login role per service.
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set it in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set it in .env}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?set it in .env}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set it in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set it in .env}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set it in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # The node name, and with it the data directory, derives from the hostname.
    # Pinning it keeps the volume valid across container recreation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set it in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set it in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-antojopos}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  rabbitmq-data:
